<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Circuit breaker sequence</title>
<style>body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:#fff;}svg{width:100%;height:auto;display:block;margin:0 auto;}</style>
</head>
<body>
<svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>

  <g font-size="12" font-weight="700">
    <rect x="60" y="20" width="130" height="32" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="125" y="41" text-anchor="middle" fill="#1d4ed8">caller</text>
    <rect x="320" y="20" width="150" height="32" rx="8" fill="#fff7e6" stroke="#d97706"/><text x="395" y="41" text-anchor="middle" fill="#92400e">circuit breaker</text>
    <rect x="620" y="20" width="160" height="32" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="700" y="41" text-anchor="middle" fill="#15803d">downstream svc</text>
  </g>
  <g stroke="#cbd5e1" stroke-dasharray="4 4">
    <line x1="125" y1="52" x2="125" y2="410"/>
    <line x1="395" y1="52" x2="395" y2="410"/>
    <line x1="700" y1="52" x2="700" y2="410"/>
  </g>

  <!-- closed -->
  <text x="40" y="80" font-size="12" font-weight="700" fill="#0f172a">closed</text>
  <line x1="125" y1="100" x2="390" y2="100" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="395" y1="120" x2="695" y2="120" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrR)"/>
  <text x="545" y="114" text-anchor="middle" font-size="11" fill="#b91c1c">fail (×3)</text>

  <!-- open -->
  <text x="40" y="170" font-size="12" font-weight="700" fill="#0f172a">open</text>
  <line x1="125" y1="190" x2="390" y2="190" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrR)"/>
  <text x="257" y="184" text-anchor="middle" font-size="11" fill="#b91c1c">fail fast (blocked)</text>
  <line x1="395" y1="190" x2="700" y2="190" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- half-open -->
  <text x="40" y="240" font-size="12" font-weight="700" fill="#0f172a">half-open (after timeout)</text>
  <line x1="125" y1="260" x2="390" y2="260" stroke="#d97706" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="395" y1="280" x2="695" y2="280" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrG)"/>
  <text x="545" y="274" text-anchor="middle" font-size="11" fill="#15803d">probe success</text>

  <!-- closed again -->
  <text x="40" y="330" font-size="12" font-weight="700" fill="#0f172a">closed again</text>
  <line x1="395" y1="350" x2="130" y2="350" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrG)"/>
  <text x="262" y="344" text-anchor="middle" font-size="11" fill="#15803d">normal calls resume</text>
</svg>
</body>
</html>
