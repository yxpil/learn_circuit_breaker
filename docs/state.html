<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Circuit breaker state machine</title>
<style>body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:#fff;}svg{width:100%;height:auto;display:block;margin:0 auto;}</style>
</head>
<body>
<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <rect x="80" y="130" width="200" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="180" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">closed</text>
  <text x="180" y="192" text-anchor="middle" font-size="11.5" fill="#166534">calls pass through</text>
  <text x="180" y="210" text-anchor="middle" font-size="10.5" fill="#64748b">failures counted</text>

  <rect x="400" y="130" width="200" height="100" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="500" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">open</text>
  <text x="500" y="192" text-anchor="middle" font-size="11.5" fill="#b91c1c">fail fast, no calls</text>
  <text x="500" y="210" text-anchor="middle" font-size="10.5" fill="#64748b">wait reset_timeout</text>

  <rect x="720" y="130" width="200" height="100" rx="12" fill="#fff7e6" stroke="#d97706" stroke-width="1.8"/>
  <text x="820" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">half-open</text>
  <text x="820" y="192" text-anchor="middle" font-size="11.5" fill="#b45309">one probe call</text>
  <text x="820" y="210" text-anchor="middle" font-size="10.5" fill="#64748b">test if recovered</text>

  <line x1="280" y1="180" x2="400" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="340" y="168" text-anchor="middle" font-size="11" fill="#b91c1c">failures ≥ threshold</text>

  <line x1="600" y1="180" x2="720" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="660" y="168" text-anchor="middle" font-size="11" fill="#92400e">timeout elapsed</text>

  <path d="M 820 230 Q 820 300 500 300 Q 200 300 180 230" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="500" y="290" text-anchor="middle" font-size="11.5" fill="#15803d">probe success → closed</text>

  <line x1="720" y1="160" x2="600" y2="160" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="660" y="148" text-anchor="middle" font-size="11" fill="#b91c1c">probe fail → open</text>
</svg>
</body>
</html>
